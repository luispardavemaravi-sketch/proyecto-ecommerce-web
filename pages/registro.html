<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <h1>Gestión de Clientes</h1>
    </header>

    <main>
        <section class="form-section">
            <div class="form-section-title">
                <div class="icon">👤</div>
              
                Registro de Nuevo Cliente
            </div>
            <p class="form-section-subtitle">Completa tus datos para crear una cuenta en la plataforma</p>

            <form name="frmRegistro" method="post" action="#">

                <fieldset>
                    <legend>Datos Personales</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nombres">Nombres <span class="required">*</span></label>
                            <input type="text" id="nombres" name="nombres"
                                   placeholder="Ej: Luis Ángel" required autofocus>
                        </div>

                        <div class="form-group">
                            <label for="apellidos">Apellidos <span class="required">*</span></label>
                            <input type="text" id="apellidos" name="apellidos"
                                   placeholder="Tus apellidos completos" required>
                        </div>

                        <div class="form-group">
                            <label for="dni">Documento de Identidad (DNI) <span class="required">*</span></label>
                            <input type="text" id="dni" name="dni"
                                   placeholder="12345678" required
                                   pattern="[0-9]{8}" maxlength="8">
                            <span class="field-hint">Solo 8 números.</span>
                        </div>

                        <div class="form-group">
                            <label for="telefono">Teléfono <span class="required">*</span></label>
                            <input type="tel" id="telefono" name="telefono"
                                   placeholder="987654321" required
                                   pattern="[0-9]{9}" maxlength="9">
                        </div>

                        <div class="form-group">
                            <label for="fecha_nac">Fecha de Nacimiento <span class="required">*</span></label>
                            <input type="date" id="fecha_nac" name="fecha_nac" required>
                        </div>

                        <div class="form-group">
                            <label for="genero">Género</label>
                            <select id="genero" name="genero">
                                <option value="">Seleccione...</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="O">Prefiero no decirlo</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <fieldset style="margin-top: 20px;">
                    <legend>Datos de Acceso</legend>
                    <div class="form-grid">
                        <div class="form-group form-full">
                            <label for="email">Correo Electrónico <span class="required">*</span></label>
                            <input type="email" id="email" name="email"
                                   placeholder="usuario@ejemplo.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Contraseña <span class="required">*</span></label>
                            <input type="password" id="password" name="password"
                                   placeholder="Mínimo 8 caracteres" required minlength="8">
                        </div>

                        <div class="form-group">
                            <label for="password_conf">Confirmar Contraseña <span class="required">*</span></label>
                            <input type="password" id="password_conf" name="password_conf"
                                   placeholder="Repite tu contraseña" required minlength="8">
                        </div>
                    </div>
                </fieldset>

                <fieldset style="margin-top: 20px; border: none; padding: 0;">
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="terminos" required>
                            Acepto los términos, condiciones y la política de privacidad <span class="required">*</span>
                        </label>
                    </div>

                    <div class="form-actions" style="margin-top: 20px;">
                        <button type="reset" class="btn btn-secondary">Limpiar Formulario</button>
                        <button type="submit" class="btn btn-primary">Registrar Cliente →</button>
                    </div>

                    <div class="form-footer" style="text-align: center; margin-top: 15px;">
                        <p>¿Ya tienes una cuenta? <a href="login.html" style="font-weight: 600;">Inicia sesión aquí</a></p>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Taller de Programación Web UTP - Avance Semana 5</p>
    </footer>

</body>
</html>
