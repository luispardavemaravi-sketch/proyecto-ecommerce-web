<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechShop</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <h1>TechShop - Gadgets & Technology</h1>
    </header>


    <main>
        <div class="form-card">
        <form action="#" method="post">
            <fieldset>
                <legend>Identificacion de Usuario</legend>

                <div class="input-group">
                    <label for="email">Correo Institucional:</label>
                    <input type="email" id="email" name="email" placeholder="u19xxxxxx@utp.edu.pe" required autofocus>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

        <div class="actions">
            <button type="submit" class="btn-primary">Ingresar</button>
        </div>

        <div class="form-footer">
            <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
<p>¿No tienes cuenta? <a href="registroUsuario.html">Regístrate aquí</a></p>
        </div>
    </fieldset>

</form>
        </div>
    </main>

    <footer>
    <p>&copy; 2026 TechShop. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
