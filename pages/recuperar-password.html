<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <h1>Gestión de Clientes</h1>
    </header>

    <main>
        <section class="form-section">
            <div class="form-section-title">
                <div class="icon">🔑</div>
                Cambio de Contraseña
            </div>
            <p class="form-section-subtitle">Actualiza tus credenciales de acceso por seguridad</p>


            <form name="frmCambiarPassword" method="post" action="#">
                <fieldset>
                    <legend>Seguridad de la Cuenta</legend>

        
                    <div class="form-grid">
                        <div class="form-group form-full">
                            <label for="pwd_actual">Contraseña Actual <span class="required">*</span></label>
                            <input type="password" id="pwd_actual" name="pwd_actual"
                                   placeholder="Ingresa tu contraseña actual" required autofocus>
                        </div>

                    
                        <div class="form-group">
                            <label for="pwd_nueva">Nueva Contraseña <span class="required">*</span></label>
                            <input type="password" id="pwd_nueva" name="pwd_nueva"
                                   placeholder="Mínimo 8 caracteres" required minlength="8">
                        </div>

                        <div class="form-group">
                            <label for="pwd_confirmar">Confirmar Nueva Contraseña <span class="required">*</span></label>
                            <input type="password" id="pwd_confirmar" name="pwd_confirmar"
                                   placeholder="Repite la nueva contraseña" required minlength="8">
                        </div>
                    </div>
                </fieldset>

                <fieldset style="margin-top: 20px; border: none; padding: 0;">
               
                    <div class="form-actions">
                        <button type="reset" class="btn btn-secondary">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Actualizar Contraseña →</button>
                    </div>

        
                    <div class="form-footer" style="text-align: center; margin-top: 15px;">
                        <a href="actualizar-perfil.html">← Volver a mi perfil</a>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Taller de Programación Web UTP - Avance Semana 5</p>
    </footer>

</body>
</html>
