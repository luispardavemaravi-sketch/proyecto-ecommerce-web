<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Perfil</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    
    <header>
        <h1>Gestión de Clientes</h1>
    </header>

    <main>
        <section class="form-section">
            <div class="form-section-title">
                <div class="icon"></div>
                Módulo 1 — Actualizar Perfil
            </div>
            <p class="form-section-subtitle">Mantén tus datos actualizados para una mejor experiencia</p>

            <form name="frmActualizarPerfil" method="post" action="#">
                <input type="hidden" name="cliente_id" value="102938">

                <fieldset>
                    <legend>Información Personal</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="upd_nombres">Nombres <span class="required">*</span></label>
                            <input type="text" id="upd_nombres" name="upd_nombres" value="Luis Ángel" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="upd_apellidos">Apellidos <span class="required">*</span></label>
                            <input type="text" id="upd_apellidos" name="upd_apellidos" value="Pardave Maravi" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="upd_telefono">Teléfono Móvil</label>
                            <input type="tel" id="upd_telefono" name="upd_telefono" value="987654321" pattern="[0-9]{9}">
                        </div>
                        
                        <div class="form-group">
                            <label for="upd_genero">Género</label>
                            <select id="upd_genero" name="upd_genero">
                                <option value="">Seleccione...</option>
                                <option value="M" selected>Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="O">Otro</option>
                            </select>
                        </div>
                        
                        <div class="form-group form-full">
                            <label for="upd_foto">Foto de Perfil</label>
                            <input type="file" id="upd_foto" name="upd_foto" accept="image/png, image/jpeg, image/webp">
                            <span class="field-hint">Formatos aceptados: JPG, PNG, WEBP. Máximo 2MB.</span>
                        </div>
                    </div>
                </fieldset>

                <fieldset style="margin-top: 20px;">
                    <legend>Preferencias del Cliente</legend>
                    <div class="form-group">
                        <label>Estado de la cuenta: <span class="required">*</span></label>
                        
                        <div class="radio-group" style="margin-top: 8px;">
                            <label class="radio-item">
                                <input type="radio" name="cli_estado" value="activo" checked required>
                                Perfil Público
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="cli_estado" value="privado">
                                Perfil Privado
                            </label>
                        </div>
                    </div>

                    <div class="form-group form-full" style="margin-top: 15px;">
                        <label for="upd_bio">Biografía / Notas adicionales:</label>
                        <textarea id="upd_bio" name="upd_bio" rows="4" placeholder="Escribe aquí detalles adicionales sobre tu perfil..."></textarea>
                    </div>
                </fieldset>

                <fieldset style="margin-top: 20px; border: none; padding: 0;">
                    <div class="form-actions">
                        <button type="reset" class="btn btn-secondary">Deshacer Cambios</button>
                        <button type="submit" class="btn btn-primary">Guardar Perfil</button>
                    </div>
                    
                    <div class="form-footer" style="text-align: center; margin-top: 15px;">
                        <a href="login.html">← Volver al inicio</a>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Taller de Programación Web UTP - Avance Semana 5</p>
    </footer>

</body>
</html>
